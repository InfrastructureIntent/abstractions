name: Package

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  package:
    name: Validate packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Discover solution and projects
        id: repo
        shell: bash
        run: |
          set -euo pipefail
          solution_count=$(find . -maxdepth 1 -type f -name '*.sln' | wc -l | tr -d ' ')
          if [ "$solution_count" -ne 1 ]; then
            echo "Expected exactly one root .sln file; found $solution_count."
            exit 1
          fi

          solution=$(find . -maxdepth 1 -type f -name '*.sln' -print -quit)
          echo "solution=$solution" >> "$GITHUB_OUTPUT"

          if find src -type f -name '*.csproj' -print -quit 2>/dev/null | grep -q .; then
            echo "has_projects=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_projects=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        if: steps.repo.outputs.has_projects == 'true'
        run: dotnet restore "${{ steps.repo.outputs.solution }}"

      - name: Build
        if: steps.repo.outputs.has_projects == 'true'
        run: dotnet build "${{ steps.repo.outputs.solution }}" --configuration Release --no-restore

      - name: Test
        if: steps.repo.outputs.has_projects == 'true'
        run: dotnet test "${{ steps.repo.outputs.solution }}" --configuration Release --no-build --no-restore

      - name: Validate release tag matches package version
        if: steps.repo.outputs.has_projects == 'true' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version=$(dotnet msbuild src/InfrastructureIntent.Abstractions/InfrastructureIntent.Abstractions.csproj -getProperty:Version -nologo | tail -n 1 | tr -d '\r')
          if [ "$tag_version" != "$package_version" ]; then
            echo "Release tag version '$tag_version' does not match package version '$package_version'."
            exit 1
          fi

      - name: Pack
        if: steps.repo.outputs.has_projects == 'true'
        run: dotnet pack "${{ steps.repo.outputs.solution }}" --configuration Release --no-build --no-restore --output artifacts/packages

      - name: Detect packages
        if: steps.repo.outputs.has_projects == 'true'
        id: packages
        shell: bash
        run: |
          if find artifacts/packages -maxdepth 1 -type f \( -name '*.nupkg' -o -name '*.snupkg' \) -print -quit 2>/dev/null | grep -q .; then
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload package artifacts
        if: steps.packages.outputs.created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*
          if-no-files-found: error

      - name: Publish package to GitHub Packages
        if: steps.packages.outputs.created == 'true' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "$GITHUB_TOKEN" \
            --skip-duplicate

      - name: Template repository notice
        if: steps.repo.outputs.has_projects != 'true'
        run: echo "No production projects exist yet; package validation is skipped for the template itself."

# NuGet.org publication is intentionally excluded during the evolving 0.x phase.
# GitHub Packages publication occurs only from version tags whose version matches
# the package Version declared by the repository.
